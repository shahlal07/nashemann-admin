name: Patch vendor admin UI

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-admin-ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vendor admin reset UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/vendors/[id]/VendorDetailClient.tsx')
          s = p.read_text()
          old = '''  async function sendAdminReset(admin: VendorAdminRow) {
    setBusy(true);
    setError(null);
    try {
      await sendVendorAdminResetLinkAction(vendor.id, vendor.name, admin.id, admin.email, admin.name, vendor.subdomain);
      setError(null);
      window.alert("Password reset email sent successfully.");
    } catch (err) {
      setError(err instanceof Error ? err.message : "Couldn't send password reset email");
    } finally {
      setBusy(false);
    }
  }'''
          new = '''  async function sendAdminReset(admin: VendorAdminRow) {
    setBusy(true);
    setError(null);
    try {
      const result = await sendVendorAdminResetLinkAction(vendor.id, vendor.name, admin.id, admin.email, admin.name, vendor.subdomain);
      setTemporaryPassword(result.temporaryPassword ?? null);
      setError(null);
    } catch (err) {
      setError(err instanceof Error ? err.message : "Couldn't generate a temporary password");
    } finally {
      setBusy(false);
    }
  }'''
          if old not in s:
              raise SystemExit('sendAdminReset block not found')
          s = s.replace(old, new, 1)

          old = '''          {addingAdmin && (
            <form onSubmit={addAdmin} className="mb-4 flex flex-wrap items-end gap-2 rounded-[var(--radius-md)] border border-[var(--border)] p-3">'''
          new = '''          {temporaryPassword && (
            <div className="mb-4 rounded-[var(--radius-md)] border border-[var(--accent-violet)]/30 bg-[var(--accent-violet)]/5 p-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p className="text-sm font-semibold text-[var(--text)]">Temporary password generated</p>
                  <p className="mt-1 text-xs text-[var(--text-faint)]">Give this password directly to the vendor. It immediately replaces their old password and their active sessions have been revoked.</p>
                </div>
                <button type="button" onClick={() => navigator.clipboard?.writeText(temporaryPassword)} className="rounded-[var(--radius-sm)] border border-[var(--border)] px-3 py-1.5 text-xs font-semibold text-[var(--text)] hover:bg-[var(--surface-hover)]">Copy</button>
              </div>
              <code className="mt-3 block rounded-[var(--radius-sm)] bg-[var(--surface-solid)] px-3 py-2 font-mono text-sm font-semibold tracking-wide text-[var(--text)]">{temporaryPassword}</code>
              <button type="button" onClick={() => setTemporaryPassword(null)} className="mt-2 text-xs text-[var(--text-faint)] hover:text-[var(--text)]">Hide password</button>
            </div>
          )}

          {addingAdmin && (
            <form onSubmit={addAdmin} className="mb-4 flex flex-wrap items-end gap-2 rounded-[var(--radius-md)] border border-[var(--border)] p-3">'''
          if old not in s:
              raise SystemExit('admin form anchor not found')
          s = s.replace(old, new, 1)

          old = '''                    aria-label="Send password reset"
                    title="Send password reset email"
                  >
                    Reset'''
          new = '''                    aria-label="Generate temporary password"
                    title="Generate a new temporary password"
                  >
                    Temp pass'''
          if old not in s:
              raise SystemExit('reset button block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/vendors/[id]/VendorDetailClient.tsx
          git diff --cached --quiet || git commit -m "Fix vendor admin temporary password UI [vendor-admin-ui-patched]"
          git push
